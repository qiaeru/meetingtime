server {
    listen 80;
    server_name meetingtime.example.com;

    # Let's Encrypt HTTP-01 challenge path, used by certbot renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name meetingtime.example.com;

    ssl_certificate     /etc/letsencrypt/live/meetingtime.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meetingtime.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Generous timeouts for the long-lived Socket.IO and Yjs WebSocket
    # connections; defaults of 60s would close idle hosts mid-meeting.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    location / {
        proxy_pass http://meetingtime:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        # Overwrite rather than append, so a client cannot prepend a spoofed IP.
        proxy_set_header X-Forwarded-For    $remote_addr;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }
}
