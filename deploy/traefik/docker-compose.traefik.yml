# HTTPS deployment with Traefik v3 (Let's Encrypt via HTTP challenge).
# Run from the project root:
#   export MEETINGTIME_DOMAIN=meetingtime.example.com
#   export LETSENCRYPT_EMAIL=you@example.com
#   docker compose -f deploy/traefik/docker-compose.traefik.yml up -d

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  meetingtime:
    build: ../..
    image: meetingtime:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${MEETINGTIME_DOMAIN}}
      HOST_TIMEOUT_MS: ${HOST_TIMEOUT_MS:-1800000}
      POST_END_GC_MS: ${POST_END_GC_MS:-300000}
      TRUST_PROXY: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.meetingtime.rule=Host(`${MEETINGTIME_DOMAIN:?Set MEETINGTIME_DOMAIN}`)"
      - "traefik.http.routers.meetingtime.entrypoints=websecure"
      - "traefik.http.routers.meetingtime.tls.certresolver=le"
      - "traefik.http.services.meetingtime.loadbalancer.server.port=3000"

volumes:
  letsencrypt:
