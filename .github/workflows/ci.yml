name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t meetingtime:ci .

      # One install at the repo root: npm workspaces hoist the production
      # dependencies of all three workspaces into the root node_modules, so a
      # single scan covers everything (the per-directory scans this replaces
      # ran on partial or empty trees and could pass vacuously).
      - name: Check dependency licenses
        run: |
          npm install --omit=dev --no-audit --no-fund
          npx --yes license-checker --production --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;OFL-1.1;CC0-1.0;Unlicense;0BSD;BlueOak-1.0.0' --excludePrivatePackages
