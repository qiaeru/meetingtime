version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      patch-and-minor:
        update-types:
          - patch
          - minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on Node 24 LTS for the runtime image; major Node bumps are a
      # deliberate maintainer decision, not a weekly Dependabot PR.
      - dependency-name: node
        update-types:
          - version-update:semver-major
